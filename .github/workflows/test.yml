name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin test .
      - run: claude plugin validate .
      - run: claude plugin validate sources/hud-git
      - run: claude plugin validate sources/hud-ci
      - run: claude plugin validate examples/source-template
